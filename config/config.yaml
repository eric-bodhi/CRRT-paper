# ============================================================================
# CRRT intra-treatment complications — single source of truth for every
# threshold, window and cut-point in the analysis.
#
# Plan Part 2.4, non-negotiable: "config.yaml holding every threshold and
# window length — no magic numbers in code." Nothing numeric that shapes the
# cohort, the label, a feature window, or an evaluation cut-point may be
# written anywhere else in this repo. If you find yourself typing a number
# into a .py or .sql file, it belongs here instead.
#
# Every value cites the Part of docs/crrt_project_outline.md it comes from.
#
# Values marked "UNLOCKED" are ones the plan states as a range or an "e.g."
# rather than a decision. They are provisional. Locking each one is a
# paper-level decision that must be written into docs/decisions.md with its
# date (Part 14) before pre-registration (Part 12) — a reviewer asking "why
# 2 hours and not 4" gets answered from that log, not from memory.
#
# Values that are `null` are ones the plan mandates a choice for but does not
# supply. They must be filled before the code that reads them can run.
# ============================================================================

reproducibility:
  # Plan 2.4 requires fixed seeds. The value itself is arbitrary; what matters
  # is that it never changes and that every stochastic step reads it.
  random_seed: 42

  # Plan 4.3 / 6.4: split and cluster by PATIENT, never by circuit or stay.
  # Named here so no split function can quietly key on something else.
  grouping_key: subject_id


paths:
  # Relative to the repo root. Everything here is under data/, which is
  # gitignored (Part 2.4): no data file is ever committed.
  # Unpacked MIMIC-IV 3.1 (hosp/, icu/). The demo has the same layout, so
  # pointing this at it runs the pipeline unchanged (Part 1.6).
  mimic_dir: data/mimiciv/3.1
  # Where crrt.adjudication_setup downloads mimic_dir from, with the
  # adjudicator's own PhysioNet login. A URL, not a path: config.path() is
  # never called on it.
  mimic_url: https://physionet.org/files/mimiciv/3.1
  duckdb: data/crrt.duckdb
  parquet_dir: data/parquet
  # The adjudication viewer's pages and the nurse's verdict sheet. Under
  # data/, so neither can be committed (Part 2.4).
  adjudication_dir: data/adjudication


itemid_inventory:
  # Part 2.3 — "Do not trust remembered itemids." This block drives the
  # evidence sweep that produces docs/itemids.md. It is deliberately
  # OVER-INCLUSIVE: the sweep exists to surface candidates for manual review,
  # not to decide anything. Inclusion is a human judgment recorded by hand in
  # that file, then promoted to docs/data_dictionary.md.

  # Every item in this d_items category is a candidate regardless of label.
  seed_category: Dialysis

  # Substring patterns matched case-insensitively against BOTH d_items.label
  # and d_items.abbreviation. Cast wide and accept false positives: a junk
  # candidate costs one line of review, a missed itemid costs a variable.
  # The pattern that matched is reported per row so noise is easy to dismiss.
  label_patterns:
    # Modality and circuit
    - dialy
    - crrt
    - cvvh
    - scuf
    - hemofilt
    - ultrafilt
    - filter
    - effluent
    - dialysate
    - replacement
    # Circuit pressures and flow (Part 7, the machine feature group)
    - access pressure
    - return pressure
    - trans membrane
    - transmembrane
    - tmp
    - pressure drop
    - blood flow
    - prefilter
    - pre-filter
    - postfilter
    - post filter
    - pbp
    # Anticoagulation (Part 7)
    - citrate
    - acd-a
    - heparin
    - anticoag
    - argatroban
    - bivalirudin
    # Vascular access (Part 7 - a known driver of filter life)
    - lumen
    # Clotting and its monitoring. Added 2026-10-02: no earlier pattern
    # matched 220507 Activated Clotting Time.
    - clot
    # Chemistry tied to the outcomes (Parts 5.2, 3). `phos`, not `phosph`:
    # the phosphate repletion items are labelled "K Phos" and "Na Phos" and
    # were missed by `phosph` until 2026-10-02.
    - calcium
    - phos
    - potassium
    - magnesium
    - bicarb
    - urea
    - creatinine
    - renal
    - kidney

  # Reported per candidate as evidence. Part 2.3 says eyeball the value
  # distribution before trusting an itemid.
  percentiles: [5, 50, 95]

  # Cap on distinct unit strings printed per row, so one dirty item cannot
  # blow up the table. Overflow is reported as a count.
  max_units_listed: 6

  # Cap on distinct Text values printed per item in the appendix.
  max_text_values_listed: 12

  # Recall cross-check only, NOT an inclusion list. These are the itemids in
  # MIT-LCP/mimic-code mimic-iv/concepts/treatment/crrt.sql (fetched
  # 2026-09-06). Part 2.3 says start from that concept and extend it, so the
  # sweep must at minimum rediscover all of them.
  mimic_code_crrt_itemids:
    [224144, 224145, 224146, 224149, 224150, 224151, 224152, 224153, 224154,
     224191, 225183, 225956, 225958, 225976, 225977, 226457, 227290, 228004,
     228005, 228006]

  # procedureevents items that document a CRRT modality actually being run,
  # used only to report a tight stay count alongside the broad one. Reporting
  # aid, NOT an inclusion decision -- inclusion is settled by hand in
  # docs/itemids.md.
  crrt_procedure_itemids: [225802, 225803, 225809, 225955]


cohort:                                     # Plan Part 4
  min_age_years: 18                         # 4.1 — adults at ICU admission
  # 4.1 — circuits shorter than this are documentation artifacts (841 are
  # under 1 h). Locked 2026-10-02 (docs/decisions.md). Applied to
  # crrt_circuits.duration_hours at the cohort step.
  min_session_duration_hours: 4
  # 4.2 — chronic dialysis dependence. Kept and flagged in the primary
  # analysis; excluded in a sensitivity analysis. Locked 2026-10-02.
  esrd_handling_primary: keep_and_flag
  esrd_handling_sensitivity: exclude
  # The flag counts only evidence that exists before the stay's first
  # circuit (decisions.md, 2026-10-02, "Chronic dialysis flag"). A stay is
  # flagged if any of these holds:
  #   - admission history: admission_history_itemid charted = 1;
  #   - last_dialysis_itemid charted with a date before the first circuit;
  #   - a tunneled_catheter_values value charted before the first circuit;
  #   - one of icd_codes on an earlier admission of the same patient.
  # Codes from the SAME admission are discharge diagnoses that can record
  # dialysis dependence that began during this stay (AKI non-recovery), so
  # they count only in the sensitivity flag. Intermittent HD earlier in the
  # same stay is not evidence: AKI patients often start on IHD.
  # Circuits >=4 h flagged: 1,742 primary (315 clotted), 2,449 sensitivity.
  chronic_dialysis:
    admission_history_itemid: 225126          # "Dialysis patient" checkbox
    admission_history_value: 1                # checked
    last_dialysis_itemid: 225128              # "Last dialysis", a date
    tunneled_catheter_values:                 # Dialysis Catheter Type
      227124: Tunneled (PermaCath)
      229536: Tunneled 2-Lumen
    # Checked against d_icd_diagnoses 2026-10-02: ESRD, renal dialysis
    # status / dependence, and noncompliance with renal dialysis (which
    # implies dependence). CKD stage 5 and the hypertensive "stage V or ESRD"
    # codes are left out because they do not separate dialysis dependence.
    icd_codes: ['5856', 'V451', 'V4511', 'V4512',
                'N186', 'Z992', 'Z9115', 'Z91151', 'Z91158']
    same_admission_icd_primary: false
    same_admission_icd_sensitivity: true
  # 4.5 — below this event count you are in a case-series regime, not a
  # modeling regime. Say so honestly rather than fitting XGBoost to it.
  min_events_for_modeling: 100


sessionization:                             # Plan Part 4.4
  # Gap with no machine parameters that starts a new CRRT session.
  gap_hours: 2
  # 4.4 explicitly requires sensitivity analyses at these gaps.
  gap_hours_sensitivity: [1, 4]


circuits:                                   # Plan Parts 4.3, 4.4, 5.1
  # The circuit is the unit of analysis (Part 4.3): one filter, from the first
  # machine charting after it is primed to the last before it comes down.
  # It is defined by FILTER IDENTITY, not by charting gaps. Under the plain
  # gap rule above, 43% of circuits >=4 h end with no documentation, and 66%
  # of those resume without a New Filter: they are pauses on the same filter,
  # not circuit ends (docs/feasibility.md §2.2). sessionization.gap_hours now
  # only cuts a stay into segments of continuous charting; this block decides
  # which segments belong to the same filter.
  # Definition and max_downtime_hours decided 2026-10-02 (docs/decisions.md).
  # The documentation windows are carried over unchanged from the
  # feasibility queries.

  # A row of any of these with a numeric value means the machine was running
  # at that charttime. Blood flow plus the four raw circuit pressures: all are
  # charted in every era, unlike 229247 TMP / 229248 Pressure Drop, which do
  # not exist before ~2014 (feasibility §1).
  machine_itemids: [224144, 224149, 224150, 224151, 224152]
  # 224146 System Integrity carries New Filter / Clotted / Clots Increasing /
  # Discontinued / Recirculating (380,652 rows, 2,901 stays). 225956 Reason
  # for CRRT Filter Change is sparse (350 rows) but used where present.
  system_integrity_itemid: 224146
  filter_change_reason_itemid: 225956

  # A gap between segments no longer than this, with no New Filter and no
  # documented end, is downtime on the same filter; a longer gap starts a new
  # circuit. Locked 2026-10-02. The documented-clot count barely moves with it (1,657 /
  # 1,674 / 1,678 at 4 / 6 / 12 h); only the undocumented bucket does
  # (feasibility §2.2).
  max_downtime_hours: 6
  max_downtime_hours_sensitivity: [4, 12]

  # A New Filter charted inside a segment starts a new circuit only when it
  # is at least this far past the segment start. Earlier than that, it is
  # documenting the filter the segment started on: 58% of New Filter events
  # fall in a segment's first hour (feasibility §2.2).
  new_filter_min_hours_after_segment_start: 1

  # Documentation windows as [hours before, hours after] an anchor. The
  # anchor is the circuit start for new_filter_at_start and the circuit end
  # (last machine charting) for the rest. They lean after the end because the
  # take-down is charted once the machine has stopped.
  windows_hours:
    new_filter_at_start: [3, 1]
    clotted_at_end: [2, 3]
    clots_increasing_at_end: [3, 1]
    stopped_at_end: [2, 3]            # Discontinued or Recirculating
    reason_at_end: [2, 6]             # 225956
    death_after_end: [1, 12]          # admissions.deathtime
    icu_discharge_after_end: [1, 6]   # icustays.outtime

  # A circuit at least this long that no higher class explains ended at the
  # scheduled change (outcomes.circuit_failure.scheduled_change_interval_hours,
  # 72 h), less slack for when in the shift the swap was done.
  reached_limit_hours: 66


prediction:                                 # Plan Part 6
  # 6.1 — at every hour t during an active circuit, using only data available
  # at or before t, predict whether the event occurs in (t, t+H].
  # Prediction times are circuit_start + k * step_hours, k = 0, 1, ...
  step_hours: 1
  horizon_hours: 6
  horizon_hours_sensitivity: [3, 12]

  # 6.2 — exclude the final minutes before the event from the feature window,
  # or you learn "the alarm that fired two minutes before the nurse changed
  # the filter": prediction of the present, not the future. State this
  # interval prominently in the manuscript; reviewers look for it.
  # UNLOCKED: the plan specifies 30–60 minutes and does not pick one.
  blanking_minutes: 30
  blanking_minutes_sensitivity: [60]

  # 6.3 — minimum circuit runtime before a row is scored, so trend features
  # actually exist.
  warmup_hours: 2


outcomes:
  circuit_failure:                          # Plan Part 5.1 — primary outcome
    # Scheduled elective swap interval. Circuit lifespan well short of this is
    # corroborating signal for premature clotting failure (5.1 step 3).
    # Also the maximum circuit age that is scored: follow-up is censored
    # here, because past it a "circuit" may be several filters stitched
    # together (1,066 of 8,414 circuits run longer). Decided 2026-10-03.
    scheduled_change_interval_hours: 72
    # 5.1 step 3 — reported median filter lifespan by mode, used as a sanity
    # benchmark for the extracted distribution, not as a label rule.
    expected_median_lifespan_hours: [17, 21]
    # 5.1 step 4 — a clinician adjudicates a sample of terminations against
    # the algorithm; report Cohen's kappa. Stratified by termination_class,
    # not simple random: a random 150 holds about 30 documented clots and 20
    # undocumented ends, too few to estimate either class. The frame is every
    # cohort circuit with a label, so death (censored) is in no stratum.
    # Kappa is weighted back to the frame (stratum size / circuits drawn).
    # Drawn once with reproducibility.random_seed and frozen before any model
    # is fit. Decided 2026-10-04 (docs/decisions.md, "Adjudication sample").
    adjudication_strata:
      clotted:
        classes: [clotted]
        circuits: 40
      clots_increasing:
        classes: [clots_increasing]
        circuits: 25
      undocumented:
        classes: [undocumented]
        circuits: 45
      other_non_event:
        classes: [reached_limit, procedure_or_line_change, icu_discharge,
                  crrt_ended, stopped_then_restarted]
        circuits: 40
    # Part 13 kill checkpoint (end of week 9): below this kappa, circuit
    # failure drops to secondary and hypophosphatemia is promoted.
    adjudication_min_kappa: 0.6
    # The frozen sample's fingerprint (decisions.md 2026-10-04, "Adjudication
    # sample"). crrt.adjudication reports whether a rerun matches it, and the
    # viewer refuses to build pages for any other sample.
    adjudication_sample_sha256: a1d751af9f20e8cf6579c1ea290f062bd56c0b8ad022dcb18663885dffc99d24
    # Practice circuits per stratum, drawn after the sample from what it left,
    # for the calibration session. Their verdicts are never counted. Decided
    # 2026-10-04 (decisions.md, "Adjudication viewer").
    adjudication_practice_per_stratum: 1
    # What one viewer page shows, in hours around circuit_end: back to the
    # circuit start but no further than before_end (72 h covers the scheduled
    # change interval), and after_end past it, where a new filter, death or
    # ICU discharge shows how the circuit really ended.
    adjudication_view_hours:
      before_end: 72
      after_end: 6
    # The adjudicator's verdicts (Part 5.1 step 2). Only `clotting` is a clot;
    # `unclear` counts as not a clot (decisions.md, "Kappa rules for
    # adjudication").
    adjudication_verdicts: [clotting, elective_scheduled, patient_related, unclear]
    # The port the adjudication app listens on, on 127.0.0.1 only, so nothing
    # outside the adjudicator's machine can reach it (decisions.md 2026-10-04,
    # "Adjudication viewer").
    adjudication_port: 8765
    # Python for a Windows adjudicator, packed into the export
    # (crrt.adjudication_viewer export) so they install nothing. It is
    # python.org's embeddable build: of its 33 .exe, .dll and .pyd files, 31
    # are signed by the Python Software Foundation and 2 (the C runtime) by
    # Microsoft, so Windows 11's Smart App Control lets them run. sha256 is
    # python.org's published checksum (its downloads API, 2026-10-04).
    # Decided 2026-10-04 (decisions.md, "The package runs on Python alone").
    adjudication_windows_python:
      url: https://www.python.org/ftp/python/3.14.8/python-3.14.8-embed-amd64.zip
      sha256: a93abe456ab01bd96d7a085b3cdb6566b3063f4241360d114142fbdb07f0a310
    # crrt_circuits.termination_class values that are the event. Primary:
    # documented Clotted only, which leaves nurse-charted Clots Increasing
    # free to be a feature and the comparator rule (Part 8.1). Sensitivity:
    # add clots_increasing. Locked 2026-10-02 (docs/decisions.md).
    # In the sensitivity analysis, Clots Increasing charted up to
    # windows_hours.clots_increasing_at_end before the end IS the event, so
    # no feature may read it and the nurse-observation comparator is
    # undefined there (decisions.md 2026-10-04, "Sensitivity analyses").
    event_classes_primary: [clotted]
    event_classes_sensitivity: [clotted, clots_increasing]
    # Circuits that end in death can never become events; they are censored
    # under the Part 5.3 competing-risk framing, not counted as non-events.
    competing_risk_classes: [death]
    # 5.1 step 5 — pre-specified, so it cannot be chosen after seeing results.
    # "Unclear" is termination_class 'undocumented' (14.5% of circuits >=4 h,
    # about a quarter of them probably hidden clots, feasibility §2.4).
    # Excluding by how a circuit ended is unknowable at prediction time, so
    # the primary keeps them as non-events. Reversed from the original
    # exclude / non_event on 2026-10-02 (feasibility §6 proposal 3).
    unclear_classes: [undocumented]
    unclear_handling_primary: non_event
    unclear_handling_sensitivity: exclude

  hypophosphatemia:                         # Plan Part 5.2 — secondary outcome
    # Incident serum phosphate during CRRT, in a patient not already below
    # threshold at prediction time. Thresholds decided 2026-10-03
    # (feasibility §6 proposal 6): moderate is the modelled outcome, the
    # sensitivity threshold rebinds the same SQL, and severe is reported
    # descriptively only (75 incident stays, under
    # cohort.min_events_for_modeling).
    moderate_mg_dl: 2.0
    sensitivity_mg_dl: 1.5
    severe_mg_dl: 1.0
    # hosp.labevents Phosphate, mg/dL (one unit in every row). Not in the
    # mimic-code chemistry concept, so it is read directly; the chartevents
    # copy 225677 is excluded (itemid_review.yaml).
    phosphate_itemid: &phosphate_itemid 50970
    # Part 3.2: "will this patient drop below 2.0 mg/dL in the next 24
    # hours". Phosphate is drawn every 6.5 h (median, feasibility §3).
    horizon_hours: 24
    # A row is at risk only if a phosphate result at or above threshold is
    # available (storetime <= t) and was drawn no longer ago than this.
    # Same 24 h window as the feasibility baseline.
    known_value_max_age_hours: 24
    # Phosphate repletion, the competing intervention of Part 5.2: a
    # hosp.prescriptions order whose lower(drug) is a key below and whose
    # route is listed for it. An order started in the label window before
    # any low draw censors the row. Orders, not administrations, for both
    # routes (decisions.md 2026-10-03, "Phosphate repletion is read from
    # orders"): emar charts medication in 37% of circuits before 2014 and
    # 98-99% from 2017, and inputevents (225834 K Phos, 225835 Na Phos)
    # loses about half of IV phosphate in 2020-22. Order starts during
    # circuits are steady in every era.
    # Reviewed by hand 2026-10-03 from every drug name containing "phos" or
    # "neutra" among cohort patients. Left out: phosphate salts of other
    # drugs (codeine, dexamethasone, oseltamivir, cyclophosphamide, ...),
    # Caphosol (a mouth rinse) and Fleet Phospho-soda (a bowel prep, under
    # 10 orders).
    repletion_orders:
      neutra-phos: [PO/NG, PO, NG]
      phosphorus: [PO/NG, PO, NG]            # K-Phos Neutral tablets
      sodium phosphate: [IV]
      potassium phosphate: [IV]
      sodium glycerophosphate: [IV]          # not in inputevents at all
    # What a repletion order in the window does to the row's label. Primary:
    # censor (Part 5.2, a competing intervention). The censor is
    # informative, since most rows it removes would have been negatives, and
    # it is heavier in the 2020-22 test era (16.4% of scored rows vs 7-9%),
    # so the sensitivity analyses bound it from both sides: ignore labels
    # the row from the draws alone (a prevented event is a negative), and
    # composite counts the order as the event (decisions.md 2026-10-03,
    # "Repletion sensitivity analysis").
    repletion_handling_primary: censor
    repletion_handling_sensitivity: [ignore, composite]

  citrate_accumulation:                     # Plan Part 3 table
    total_to_ionized_calcium_ratio: 2.5


features:                                   # Plan Part 7
  # Windows over which last value / mean / min / max / slope / variance are
  # computed for each machine and clinical signal. Changed from [1, 3, 6] on
  # 2026-10-02: machine charting is hourly (median interval 60 min,
  # feasibility §1), so a 1 h window holds a single point.
  window_hours: [3, 6, 12]
  # Slope and variance are computed only from at least this many points in
  # the window; with fewer they are missing (and flagged), not zero.
  min_points_for_trend: 3

  # Plan 7 requires physiologic plausibility bounds, unit harmonization and
  # duplicate resolution to live here rather than scattered through notebooks.
  # Populate per variable as itemids are validated (Part 2.3), and mirror
  # each entry in docs/data_dictionary.md.
  #
  # itemid: [low, high], inclusive, in the item's charted unit. A value
  # outside is set to missing, never clipped, except the raw circuit
  # pressures below. Decided 2026-10-03 (docs/decisions.md, "Plausibility
  # bounds for the CRRT machine items"), where every bound has its evidence.
  # "device" = the operating or settable range in the Prismaflex Service
  # Manual (G5005209, software 7.xx, §8), identical on the PrisMax spec
  # sheet. The other sources are named per line.
  plausibility_bounds:
    224144: [10, 450]       # Blood Flow, ml/min. Device.
    224149: [-250, 450]     # Access Pressure, mmHg. Device.
    224150: [-50, 450]      # Filter Pressure, mmHg. Device.
    224151: [-350, 400]     # Effluent Pressure, mmHg. Device.
    224152: [-50, 350]      # Return Pressure, mmHg. Device.
    # TMP = (filter + return)/2 - effluent and pressure drop = filter -
    # return (the manual's formulas), at the extremes of the sensor ranges.
    229247: [-450, 750]     # Trans Membrane Pressure, mmHg.
    229248: [-400, 500]     # Pressure Drop, mmHg.
    224153: [0, 8000]       # Replacement Rate, ml/hr. Device.
    228006: [0, 8000]       # Post Filter Replacement Rate, ml/hr. Device (replacement).
    228005: [0, 4000]       # PBP (Prefilter) Replacement Rate, ml/hr. Device.
    224154: [0, 8000]       # Dialysate Rate, ml/hr. Device.
    224191: [0, 2000]       # Hourly Patient Fluid Removal, mL. Device.
    # Achieved net removal per hour, so the fluid-removal setting's range.
    226457: [0, 2000]       # Ultrafiltrate Output, mL.
    # A net-balance goal per hour; may be positive, as other inputs count.
    225183: [-2000, 2000]   # Current Goal, mL.
    # Not on the machine (ACD-A runs on an external pump). Bounded at the
    # empty gap in the data: no row in (350, 450] ml/hr.
    228004: [0, 350]        # Citrate (ACD-A), ml/hr.
    # Not on the machine in these units. The tail is continuous to 4,000
    # units/hr and sparse beyond it, half of that above 10,000.
    224145: [0, 4000]       # Heparin Dose (per hour), units.
    # hosp.labevents, not in the hand review (labs come from labevents, never
    # the chartevents copies). Cut where the continuous tail ends, as for
    # citrate and heparin. Decided 2026-10-04 (docs/decisions.md,
    # "Anticoagulation features"); to the mentor's plausibility review.
    # Below 0.6 is a hump around 0.3, the post-filter target on citrate: a
    # circuit sample, not the patient. 0.6 is the feasibility §4 cut.
    50808: [0.6, 2.0]       # Free Calcium (ionized), mmol/L.
    50893: [4, 15]          # Calcium, Total, mg/dL.
    # hosp.labevents, the coagulation/hematology and chemistry groups.
    # Decided 2026-10-04 (docs/decisions.md, "Laboratory features"); to the
    # mentor's plausibility review. Read from every result the features can
    # see: circuit_start - lab_lookback_hours to circuit_end. These are
    # analyser results, so a value is cut only where it sits alone past an
    # empty stretch of the tail, or is impossible. Every other bound is the
    # edge of the data and cuts nothing.
    51265: [5, 1300]        # Platelet Count, K/uL. Below 5 is reported as text.
    51237: [0.7, 27.5]      # INR(PT).
    51275: [18, 150]        # PTT, sec. 150 is the analyser's ceiling (">150").
    51214: [25, 1800]       # Fibrinogen, Functional, mg/dL.
    51222: [2.5, 25]        # Hemoglobin, g/dL.
    51221: [7, 72]          # Hematocrit, %.
    50970: [0.5, 24]        # Phosphate, mg/dL. None in (24, 27).
    50971: [1.25, 10]       # Potassium, mEq/L.
    50960: [0.6, 8.5]       # Magnesium, mg/dL. None in (8.5, 11).
    50882: [2, 45]          # Bicarbonate, mEq/L.
    51006: [1, 260]         # Urea Nitrogen, mg/dL. None in (260, 300).
    # Creatinine 0 is not a result; mimic-code drops it too.
    50912: [0.1, 22]        # Creatinine, mg/dL. None in (22, 32).
    50931: [10, 1300]       # Glucose, mg/dL. None in (6, 10) or (1300, 1600).
    51000: [15, 4000]       # Triglycerides, mg/dL.

  # Raw circuit pressures only: a value past a bound by at most this much is
  # the sensor at its limit, charted as a round number (filter pressure 500
  # against 450). It is set to the bound, not missing. These values are 11
  # times as common in the last 3 h of clotted circuits as elsewhere, so
  # dropping them would remove clotting signal just before the event.
  pressure_clip_margin_mmhg: 50
  pressure_clip_itemids: [224149, 224150, 224151, 224152]

  # The machine/circuit feature group (Part 7, first bullet), built by
  # sql/machine_features.sql. Decided 2026-10-03 (docs/decisions.md,
  # "Machine features"). Signal name: chartevents itemid. Each needs an entry
  # in plausibility_bounds. The SQL refers to these names to derive
  # pressure_drop, tmp, uf_rate, pressure_drop_per_blood_flow and
  # tmp_per_uf_rate. Charted 229247 TMP and 229248 Pressure Drop are left
  # out: they do not exist before ~2014, so their presence would encode the
  # era. The derived values cover every era.
  machine_signals:
    blood_flow: 224144                    # ml/min
    access_pressure: 224149               # mmHg
    filter_pressure: 224150               # mmHg
    effluent_pressure: 224151             # mmHg
    return_pressure: 224152               # mmHg
    # Total replacement, pre- plus post-filter: it is >= 228006 at the same
    # charttime in 99.2% of rows, and 228006 is a median 12.5% of it.
    replacement_rate: 224153              # ml/hr
    post_filter_replacement_rate: 228006  # ml/hr, part of replacement_rate
    pbp_rate: 228005                      # ml/hr
    dialysate_rate: 224154                # ml/hr
    fluid_removal_rate: 224191            # mL per hour, the net UF setting
    ultrafiltrate_output: 226457          # mL, achieved net removal
    current_goal: 225183                  # mL, net-balance goal per hour
  # 227290 CRRT mode, Text. Carried as its last charted value.
  crrt_mode_itemid: 227290

  # The anticoagulation feature group (Part 7, third bullet), built by
  # sql/anticoag_features.sql. Decided 2026-10-04 (docs/decisions.md,
  # "Anticoagulation features"). Hourly chartevents only: the inputevents
  # records (ACD-A, CRRT calcium, heparin, argatroban, bivalirudin) lose
  # about half their rows in 2020-22, the temporal test era, and are stored
  # around the end of each bag or rate segment, not its start.
  # Signal name: chartevents itemid, with the machine signals' window
  # statistics. Each needs an entry in plausibility_bounds.
  anticoag_signals:
    citrate_rate: 228004    # ml/hr ACD-A. 0 = citrate off, not missing.
    # The heparin infusion (inputevents 225152) as charted hourly on the
    # CRRT flowsheet, not a separate pre-filter dose: a 225152 infusion is
    # running at 77-90% of positive rows before 2020, at the same rate
    # within 5% in most of them.
    heparin_dose: 224145    # units/hr
  # Signal name: hosp.labevents itemid. Read under lab_lookback_hours with
  # the lab groups' columns: last value and change from the previous result,
  # no window statistics (decisions.md 2026-10-04, "Laboratory features").
  calcium_labs:
    ionized_calcium: 50808  # Free Calcium, blood gas, mmol/L
    total_calcium: 50893    # Calcium, Total, chemistry, mg/dL
  # A total calcium is paired with the ionized calcium drawn nearest to it,
  # if no further than this, for the total:ionized ratio. The feasibility §4
  # window: 93% of total calcium results inside circuits have one.
  calcium_pair_minutes: 60
  # mg/dL per mmol/L of calcium (molar mass 40.08 g/mol). Puts total calcium
  # in the ionized calcium's unit before the ratio.
  calcium_mg_dl_per_mmol_l: 4.008

  # The coagulation/hematology and chemistry feature groups (Part 7, fourth
  # and seventh bullets), built by sql/lab_features.sql into one table,
  # lab_features. Decided 2026-10-04 (docs/decisions.md, "Laboratory
  # features"). Group: {signal name: hosp.labevents itemid}. The itemids are
  # the mimic-code coagulation, complete_blood_count and chemistry concepts'
  # (fetched 2026-10-04), except magnesium, phosphate and triglycerides,
  # which no concept carries. Each needs an entry in plausibility_bounds.
  # Last value and change from the previous result, no window statistics:
  # drawn about every 6 h, so a window rarely holds min_points_for_trend.
  # D-dimer (Part 7) is left out: it is
  # drawn in 1-3% of circuits before 2020 and 11.5% in 2020-22, and in two
  # units in 2008-10.
  lab_groups:
    coagulation_hematology:
      platelets: 51265      # Platelet Count, K/uL
      inr: 51237            # INR(PT)
      ptt: 51275            # PTT, sec
      fibrinogen: 51214     # Fibrinogen, Functional, mg/dL
      hemoglobin: 51222     # Hemoglobin, g/dL
      hematocrit: 51221     # Hematocrit, %
    chemistry:
      phosphate: *phosphate_itemid  # Phosphate, mg/dL: the hypophosphatemia item
      potassium: 50971      # Potassium, mEq/L. Serum, not 50822 whole blood.
      magnesium: 50960      # Magnesium, mg/dL
      bicarbonate: 50882    # Bicarbonate, mEq/L. Not 50804 blood gas total CO2.
      bun: 51006            # Urea Nitrogen, mg/dL
      creatinine: 50912     # Creatinine, mg/dL
      glucose: 50931        # Glucose, mg/dL. Not 50809 blood gas.
      triglycerides: 51000  # Triglycerides, mg/dL
  # A lab result, of the lab groups or calcium_labs, counts at prediction
  # time t if drawn no earlier than this before t; the previous result of a
  # delta too. Platelets, INR and PTT are often drawn once a day (p90 gap
  # between draws inside a circuit 23-24 h): over 12 h, INR is missing at
  # 39% of scored rows, over 24 h at 11%. Same 24 h as
  # hypophosphatemia.known_value_max_age_hours.
  lab_lookback_hours: 24

  # The vascular access feature group (Part 7, sixth bullet), built by
  # sql/access_features.sql. Decided 2026-10-04 (docs/decisions.md, "Access
  # features"). Text and dates, so no plausibility bounds. Catheter site and
  # side are left out: the only source, 224270 `location`, is filled in when
  # the catheter comes out (93% of catheters removed inside the stay, 4% of
  # those still in at ICU discharge), so it is future information at t.
  # Dialysis Catheter Type, chartevents Text: {itemid: {value: class}}. The
  # older (227124) and newer (229536) vocabularies harmonised to tunneled /
  # temporary. A value not listed is skipped.
  access_catheter_types:
    227124:
      Tunneled (PermaCath): tunneled
      Temporary (Quinton): temporary
      Temporary with non-dialysis port (VIP): temporary
    229536:
      Tunneled 2-Lumen: tunneled
      Temporary 2-Lumen: temporary
      Temporary 3-Lumen: temporary
  # Dialysis Catheter Insertion Date, datetimeevents, a date. Read for the
  # catheter's age in whole days.
  access_insertion_date_itemid: 225322


reporting:                                  # Plan Part 1.4
  # Printed counts below this are shown as "<10", in console output and in
  # anything committed. PhysioNet small-cell rule; team position in
  # docs/decisions.md (2026-10-02, aggregate results).
  small_cell_threshold: 10


validation:                                 # Plan Parts 8.2, 9
  # 9.1 grouped k-fold + bootstrap optimism correction; 8.2 nested CV with an
  # outer loop for performance and an inner loop for hyperparameters, grouped
  # by patient at both levels. The plan mandates the procedures but names no
  # numbers — fill these in and log the choice.
  outer_folds: null
  inner_folds: null
  bootstrap_iterations: null
  # 9.2 — train on earlier anchor_year_group cohorts, test on later ones.
  temporal_split_anchor_year_group: null


evaluation:                                 # Plan Part 10
  # Clinical operating characteristics are reported at a fixed alert budget:
  # one alert per circuit per 12 hours. Nurses do not care about AUROC; they
  # care how many false alarms per shift.
  alert_budget_alerts: 1
  alert_budget_hours: 12

  # Plan 6.5 negative control: refit the whole pipeline on a shuffled label.
  # If AUROC materially exceeds 0.5 you have leakage. Run every time the
  # pipeline changes.
  shuffled_label_control:
    expected_auroc: 0.5
    # UNLOCKED: the plan says "materially exceeds" and gives no number.
    auroc_tolerance: null
