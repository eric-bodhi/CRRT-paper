  224144: {verdict: include, roles: [circuit, feature], reason: "Blood flow, ml/min in every row, p1–p99 120–250. 77 zero rows and 17 negative rows go to plausibility bounds. No duplicate charttimes. In circuits.machine_itemids."}
  224149: {verdict: include, roles: [circuit, feature, comparator], reason: "Access (arterial) pressure, mmHg, p1–p99 -151 to -1. Negative by design: 339,000 of 342,216 rows. The few positive values are not concentrated in ECMO stays, so they are bounds candidates. In circuits.machine_itemids."}
  224150: {verdict: include, roles: [circuit, feature, comparator], reason: "Filter (pre-filter) pressure, mmHg, p1–p99 54–280. Rises as the filter clots. Input to the derived pressure drop and TMP. In circuits.machine_itemids."}
  224151: {verdict: include, roles: [circuit, feature, comparator], reason: "Effluent pressure, mmHg, p1–p99 -142 to 106. Sign varies by design (60% negative). Input to the derived TMP. In circuits.machine_itemids."}
  224152: {verdict: include, roles: [circuit, feature, comparator], reason: "Return (venous) pressure, mmHg, p1–p99 9–161. Input to the derived pressure drop and TMP. In circuits.machine_itemids."}
  229247: {verdict: include, roles: [feature, comparator], reason: "Machine-computed TMP, mmHg, p50 81. Only 2,094 stays: 38% of 2008–2013, 91% of 2014–2016, all of 2017–2022 (by anchor_year_group). Tracks (filter+return)/2 - effluent at a stable -16.5 mmHg offset, within ±10 in 91% of rows, so it can be derived where it is not charted (decisions.md)."}
  229248: {verdict: include, roles: [feature, comparator], reason: "Machine-computed pressure drop, mmHg, p50 42. Same era coverage as 229247. Tracks filter - return at a -27 mmHg offset, within ±10 in 75% of rows (60% in 2020–2022). The Hu 2026 rule is built on it (Part 3.1)."}
  224146: {verdict: include, roles: [circuit, label, comparator], reason: "System Integrity. Exactly 10 values, all charted ≥10 times: New Filter / Clotted / Clots Increasing / Discontinued / Recirculating and others. Carries filter identity (circuit), the primary event (label) and Clots Increasing (the nurse comparator, Part 8.1). Every row has a value."}
  225956: {verdict: include, roles: [circuit, label], reason: "Reason for filter change. Sparse (350 rows, 267 stays) but unambiguous: Clotted / Procedure / Line changed. Used where present (circuits.filter_change_reason_itemid)."}
  227290: {verdict: include, roles: [feature], reason: "CRRT mode: CVVHDF 95% of rows, CVVHD, CVVH, SCUF. Modality changes filtration fraction and so clotting risk."}
  228004: {verdict: include, roles: [feature], reason: "Citrate (ACD-A) rate, ml/hr, hourly from the machine. >0 in 6,190 of 8,414 circuits (74%): the main anticoagulation signal. Zeros (71,025 rows) mean citrate off, not missing."}
  224145: {verdict: include, roles: [feature], reason: "Circuit heparin dose. The unit is charted as `units` but the item is per hour (label). >0 in 1,928 circuits; 0 in 71% of rows (no circuit heparin)."}
  225958: {verdict: exclude, reason: "Heparin concentration, Text. 89% `Not applicable`. 224145 already records the dose in units, so concentration adds nothing."}
  224191: {verdict: include, roles: [feature], reason: "Hourly patient fluid removal (net UF setting), mL, p50 360. Drives filtration fraction. Not interchangeable with 226457: within 10 mL at the same charttime in only 44% of rows."}
  225183: {verdict: include, roles: [feature], reason: "Current fluid balance goal, mL, p1–p99 -300 to 250. A prescription signal; 0 in 41% of rows."}
  226457: {verdict: include, roles: [feature], reason: "Ultrafiltrate output, mL, p50 352. Achieved removal, distinct from the 224191 setting (see there). 2.3% of rows fall outside circuits (intermittent HD/SCUF); use only rows inside a circuit."}
  224153: {verdict: include, roles: [feature, hypophos], reason: "Replacement rate, ml/hr, p50 1800. Part of delivered dose, which drives both filtration fraction (clotting) and phosphate clearance (Part 3.2)."}
