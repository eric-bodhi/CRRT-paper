# ============================================================================
# Hand review of every candidate in docs/itemids.md (plan Part 2.3).
#
# This file is the record of the review, and the only place a verdict lives.
# `crrt.itemid_inventory` regenerates docs/itemids.md on every run of
# run_all.sh and writes each verdict below into that file's `include? / reason`
# column. A verdict typed straight into docs/itemids.md would be erased by the
# next run.
#
# Reviewed 2026-10-02 against the full MIMIC-IV 3.1 build. Every number quoted
# in a reason is an aggregate with cells under 10 suppressed (decisions.md,
# 2026-10-02). "Circuits" means crrt_circuits rows of at least
# cohort.min_session_duration_hours (8,414). The evidence and the judgment
# calls are summarised in docs/decisions.md, 2026-10-02, "Itemid review".
#
# verdict: include | exclude
# roles (include only), i.e. what the item is FOR:
#   circuit     defines circuits: machine running, filter events (Part 4.4)
#   label       documents how a circuit ended (Part 5.1)
#   comparator  input to a simple comparator rule (Part 8.1)
#   feature     candidate predictor (Part 7). A candidate, not a commitment:
#               the feature stage still applies plausibility bounds and the
#               leakage checklist
#   hypophos    input to the hypophosphatemia outcome: repletion or
#               phosphate-containing fluid (Part 5.2)
#   cohort      inclusion, exclusion or flag (Part 4.1-4.2)
#   validation  used only to check the circuit definition, never as an input
#
# Laboratory values are deliberately absent. MIMIC copies them into
# chartevents, and they are taken from hosp.labevents instead (see the Labs
# block below). Labevents itemids are not in this sweep: they come through
# the mimic-code chemistry, coagulation and complete_blood_count concepts.
# ============================================================================

